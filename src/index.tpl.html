<title>Arda Atlas</title>
<meta name="description" content="A procedurally generated, Earth-like globe of Middle-earth with GIS layers, weather, journeys and a ground-level explorer.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:ital,wght@0,400;0,500;0,700;1,400&family=IBM+Plex+Mono:wght@400;500&family=IM+Fell+English:ital@0;1&family=IM+Fell+English+SC&display=swap">
<style>/*MAPLIBRE_CSS*/</style>
<style>/*APP_CSS*/</style>

<div id="map" aria-label="Globe of Arda"></div>
<canvas id="wind" aria-hidden="true"></canvas>

<div id="loader" role="status">
  <div class="inner">
    <h1>ARDA</h1>
    <div class="sub">An atlas of Middle-earth at the end of the Third Age</div>
    <div class="bar"><i id="lbar"></i></div>
    <div class="step" id="lstep">Opening the Red Book…</div>
  </div>
</div>

<div id="top">
  <div id="brand" class="glass"><b>ARDA</b><span>Atlas of Middle-earth</span></div>
  <div id="search">
    <svg viewBox="0 0 24 24" fill="none" stroke-width="2" stroke-linecap="round"><circle cx="11" cy="11" r="7"/><path d="m20 20-4-4"/></svg>
    <input id="q" type="search" autocomplete="off" spellcheck="false" placeholder="Search places, rivers, realms…" aria-label="Search the atlas">
    <div id="results" class="glass" role="listbox"></div>
  </div>
</div>

<nav id="rail" class="glass" aria-label="Tools">
  <button data-p="layers" data-tip="Layers" aria-label="Layers"><svg viewBox="0 0 24 24"><path d="m12 3 9 5-9 5-9-5 9-5Z"/><path d="m3 13 9 5 9-5"/><path d="m3 17.5 9 5 9-5" opacity=".5"/></svg></button>
  <button data-p="journeys" data-tip="Journeys & timeline" aria-label="Journeys"><svg viewBox="0 0 24 24"><path d="M4 19c3-1 3-6 7-7s5-5 9-7"/><circle cx="4" cy="19" r="1.6"/><circle cx="20" cy="5" r="1.6"/><path d="M11 12l1 1"/></svg></button>
  <button data-p="weather" data-tip="Weather" aria-label="Weather"><svg viewBox="0 0 24 24"><path d="M7 17h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 10a3.5 3.5 0 0 0 1 7Z"/><path d="M9 20.5l-1 1.5M13 20.5l-1 1.5M17 20.5l-1 1.5" opacity=".6"/></svg></button>
  <button data-p="tours" data-tip="Guided flights" aria-label="Guided flights"><svg viewBox="0 0 24 24"><path d="M3 12h4l3-8 4 16 3-8h4"/></svg></button>
  <button data-p="measure" data-tip="Measure distance" aria-label="Measure"><svg viewBox="0 0 24 24"><path d="M3 17 17 3l4 4L7 21z"/><path d="m7 13 2 2M10 10l2 2M13 7l2 2"/></svg></button>
  <button data-p="ground" data-tip="Ground view — click a spot" aria-label="Ground view"><svg viewBox="0 0 24 24"><circle cx="12" cy="5" r="2.2"/><path d="M12 8v7M8.5 11h7M12 15l-3 6M12 15l3 6"/></svg></button>
  <button data-p="sound" data-tip="Music & sound" aria-label="Music and sound"><svg viewBox="0 0 24 24"><path d="M9 18V5l11-2v13"/><circle cx="6" cy="18" r="3"/><circle cx="17" cy="16" r="3"/></svg></button>
  <button data-p="about" data-tip="About this atlas" aria-label="About"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 11v6M12 7.5v.5"/></svg></button>
</nav>

<section id="panel" class="glass" aria-live="polite"></section>
<article id="card" class="glass" aria-live="polite"></article>

<div id="timeline" class="glass">
  <button id="play" aria-label="Play timeline"><svg viewBox="0 0 16 16" id="playico"><path d="M4 2.5v11l9-5.5z"/></svg></button>
  <div id="tdate">—</div>
  <div id="tmeta">
    <select id="story" aria-label="Story"><option value="war">War of the Ring</option><option value="return">Return &amp; the Grey Havens</option><option value="hobbit">There and Back Again</option></select>
    <select id="speed" aria-label="Playback speed"><option value="0.0417">1 hour / s</option><option value="0.25" selected>6 hours / s</option><option value="1">1 day / s</option><option value="4">4 days / s</option></select>
  </div>
  <div id="track"><div id="ticks"></div><input id="slider" type="range" min="0" max="1000" step="0.1" aria-label="Date"></div>
  <div id="ticker"></div>
</div>

<div id="status" class="glass"><div id="s1">—</div><div id="s2">&nbsp;</div></div>
<div id="scale"></div>
<div id="ctrl">
  <button id="ctog" class="glass" aria-controls="cgrps" aria-expanded="true" aria-label="Show or hide map controls"><svg viewBox="0 0 24 24"><path d="m14 6-6 6 6 6"/></svg></button>
  <div id="cgrps">
  <div class="grp glass">
    <button id="zin" aria-label="Zoom in"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg></button>
    <button id="zout" aria-label="Zoom out"><svg viewBox="0 0 24 24"><path d="M5 12h14"/></svg></button>
    <button id="compass" aria-label="Reset north"><svg viewBox="0 0 24 24"><path d="m12 3 4 9h-8z" fill="#df6a4c" stroke="none"/><path d="m12 21-4-9h8z" fill="currentColor" stroke="none" opacity=".6"/></svg></button>
  </div>
  <div class="grp glass">
    <button id="b3d" class="on" aria-label="Toggle 3D terrain">3D</button>
    <button id="bglobe" class="on" aria-label="Toggle globe"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3c3 3 3 15 0 18M12 3c-3 3-3 15 0 18"/></svg></button>
    <button id="bwx" class="on" aria-pressed="true" aria-label="Show or hide weather" title="Weather on/off"><svg viewBox="0 0 24 24"><path d="M7 17h10a4 4 0 0 0 .5-7.97A6 6 0 0 0 6 10a3.5 3.5 0 0 0 1 7Z"/></svg></button>
    <button id="bhome" aria-label="Fly to Middle-earth"><svg viewBox="0 0 24 24"><path d="M4 11 12 4l8 7v9H4z"/><path d="M10 20v-5h4v5"/></svg></button>
  </div>
  </div>
</div>

<div id="caption" class="glass" aria-live="polite"></div>
<div id="toast" class="glass" role="status"></div>

<div id="ground" aria-label="Ground view">
  <div id="glabels"></div>
  <div id="ghud">
    <button id="gexit" class="btn primary">← Back to map</button>
    <div class="glass"><div id="gplace">—</div><div id="gsub">—</div></div>
  </div>
  <div id="gcomp" class="glass"><div class="strip" id="gstrip"></div></div>
  <canvas id="gmini" width="300" height="300"></canvas>
  <div id="ghelp" class="glass"><kbd>W</kbd><kbd>A</kbd><kbd>S</kbd><kbd>D</kbd> walk · drag to look · <kbd>Shift</kbd> run · <kbd>Space</kbd>/<kbd>C</kbd> rise &amp; fall · <kbd>T</kbd> advance an hour</div>
  <div id="gpad"><span></span><button data-k="w">▲</button><span></span><button data-k="a">◀</button><button data-k="s">▼</button><button data-k="d">▶</button></div>
  <div id="gload" class="glass">Walking out…</div>
</div>

<script src="https://cdn.jsdelivr.net/npm/maplibre-gl@5.24.0/dist/maplibre-gl.js"></script>
<script id="src-gen">/*GEN_JS*/</script>
<script id="src-wx">/*WX_JS*/</script>
<script id="src-worker" type="text/plain">/*WORKER_JS*/</script>
<script>/*GEO_JS*/</script>
<script>/*ROUTES_JS*/</script>
<script>/*SOURCES_JS*/</script>
<script>/*AVATARS_JS*/</script>
<script>/*RASTERS_JS*/</script>
<script>/*AUDIO_JS*/</script>
<script>/*APP_JS*/</script>
<script type="module">/*GROUND_JS*/</script>
