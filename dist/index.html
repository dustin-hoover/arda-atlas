<style>:root {
  /* Layout: full-bleed planet. Instruments float: search + rail top-left, working panel left,
     place dossier right, Shire-calendar timeline along the bottom edge. One committed dark look. */
  --ink: #0a0d12;
  --panel: rgba(15, 19, 26, 0.9);
  --panel-solid: #12171f;
  --raise: rgba(255, 244, 214, 0.05);
  --rule: rgba(222, 204, 160, 0.15);
  --fg: #ece6d6;
  --muted: #9e978a;
  --faint: #6f6a61;
  --gold: #d9ac52;
  --gold-dim: rgba(217, 172, 82, 0.18);
  --ithil: #8ec5d6;
  --ember: #df6a4c;
  --leaf: #9cc47a;
  --font-display: 'IM Fell English', 'Iowan Old Style', 'Palatino Linotype', Georgia, serif;
  --font-sc: 'IM Fell English SC', 'IM Fell English', Georgia, serif;
  --font-ui: 'Alegreya Sans', 'Gill Sans', 'Segoe UI', system-ui, sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  --r: 10px;
  --shadow: 0 10px 40px rgba(0, 0, 0, 0.45), 0 1px 0 rgba(255, 255, 255, 0.04) inset;
  color-scheme: dark;
}
html, body { height: 100%; }
body { margin: 0; background: var(--ink); color: var(--fg); font: 15px/1.45 var(--font-ui); overflow: hidden; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
#map { position: fixed; inset: 0; background: radial-gradient(ellipse at 50% 60%, #0e1520 0%, #07090d 70%); }
#stars { position: fixed; inset: 0; pointer-events: none; }
.maplibregl-canvas { outline: none; }

/* ---------- loader ---------- */
#loader { position: fixed; inset: 0; z-index: 50; display: grid; place-items: center; background: radial-gradient(ellipse at 50% 40%, #121a24 0%, #07090c 75%); transition: opacity 0.9s ease; }
#loader.gone { opacity: 0; pointer-events: none; }
#loader .inner { width: min(440px, calc(100vw - 48px)); text-align: center; }
#loader h1 { font: 400 clamp(40px, 9vw, 64px)/1 var(--font-sc); letter-spacing: 0.32em; margin: 0 0 6px; padding-left: 0.32em; color: var(--fg); }
#loader .sub { font: italic 17px/1.3 var(--font-display); color: var(--muted); margin-bottom: 28px; }
#loader .bar { height: 2px; background: var(--rule); overflow: hidden; border-radius: 2px; }
#loader .bar i { display: block; height: 100%; width: 0; background: var(--gold); transition: width 0.4s ease; }
#loader .step { margin-top: 12px; font: 12px/1.4 var(--font-data); color: var(--faint); letter-spacing: 0.04em; min-height: 1.4em; }
#loader .err { color: var(--ember); font-family: var(--font-ui); font-size: 14px; }

/* ---------- chrome ---------- */
.glass { background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(14px) saturate(1.2); -webkit-backdrop-filter: blur(14px) saturate(1.2); }
#top { position: fixed; top: calc(12px + env(safe-area-inset-top, 0px)); left: 12px; z-index: 10; display: flex; flex-direction: column; gap: 8px; width: 340px; max-width: calc(100vw - 24px); }
#brand { display: flex; align-items: baseline; gap: 10px; padding: 10px 14px 8px; }
#brand b { font: 400 22px/1 var(--font-sc); letter-spacing: 0.28em; }
#brand span { font: italic 14px/1 var(--font-display); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#search { position: relative; }
#search input { width: 100%; box-sizing: border-box; padding: 11px 14px 11px 38px; background: var(--panel); border: 1px solid var(--rule); border-radius: var(--r); box-shadow: var(--shadow); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); }
#search input::placeholder { color: var(--faint); }
#search svg { position: absolute; left: 12px; top: 12px; width: 17px; height: 17px; stroke: var(--muted); }
#results { position: absolute; top: calc(100% + 6px); left: 0; right: 0; max-height: 50vh; overflow: auto; padding: 4px; display: none; }
#results.open { display: block; }
#results button { display: flex; width: 100%; gap: 10px; align-items: baseline; text-align: left; background: none; border: 0; padding: 8px 10px; border-radius: 7px; }
#results button:hover, #results button.sel { background: var(--raise); }
#results .n { font: 16px/1.2 var(--font-display); }
#results .k { margin-left: auto; font: 11px var(--font-data); color: var(--faint); text-transform: uppercase; letter-spacing: 0.06em; white-space: nowrap; }
#results .a { font: italic 13px var(--font-display); color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

#rail { position: fixed; left: 12px; top: calc(128px + env(safe-area-inset-top, 0px)); z-index: 10; display: flex; flex-direction: column; gap: 4px; padding: 5px; }
#rail button { width: 42px; height: 42px; display: grid; place-items: center; border: 0; background: none; border-radius: 8px; color: var(--muted); position: relative; }
#rail button:hover { background: var(--raise); color: var(--fg); }
#rail button.on { background: var(--gold-dim); color: var(--gold); }
#rail svg { width: 21px; height: 21px; stroke: currentColor; fill: none; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
#rail button[data-tip]:hover::after { content: attr(data-tip); position: absolute; left: calc(100% + 10px); top: 50%; transform: translateY(-50%); background: var(--panel-solid); border: 1px solid var(--rule); padding: 4px 9px; border-radius: 6px; font-size: 13px; white-space: nowrap; color: var(--fg); pointer-events: none; }

#panel { position: fixed; left: 70px; top: calc(128px + env(safe-area-inset-top, 0px)); z-index: 9; width: 330px; max-height: calc(100vh - 250px); overflow: auto; padding: 14px 16px 16px; display: none; }
#panel.open { display: block; }
.ph { display: flex; align-items: baseline; justify-content: space-between; gap: 10px; margin-bottom: 10px; }
.ph h2 { font: 400 22px/1.1 var(--font-display); margin: 0; text-wrap: balance; }
.x { border: 0; background: none; color: var(--muted); font-size: 20px; line-height: 1; padding: 2px 6px; border-radius: 6px; }
.x:hover { color: var(--fg); background: var(--raise); }
.eyebrow { font: 500 11px/1 var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--faint); margin: 16px 0 8px; }
.eyebrow:first-child { margin-top: 2px; }
.row { display: flex; align-items: center; gap: 10px; padding: 6px 0; }
.row label { flex: 1; min-width: 0; cursor: pointer; display: flex; align-items: center; gap: 10px; }
.row small { color: var(--faint); font-size: 12px; }
.sw { width: 14px; height: 14px; border-radius: 3px; flex: none; border: 1px solid rgba(255, 255, 255, 0.15); }
.tog { appearance: none; -webkit-appearance: none; width: 32px; height: 18px; border-radius: 10px; background: #2a2f38; position: relative; flex: none; cursor: pointer; transition: background 0.2s; margin: 0; }
.tog::after { content: ''; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px; border-radius: 50%; background: #cfc8b8; transition: transform 0.2s; }
.tog:checked { background: var(--gold); }
.tog:checked::after { transform: translateX(14px); background: #1a1408; }
.seg { display: flex; background: rgba(255, 255, 255, 0.04); border: 1px solid var(--rule); border-radius: 8px; padding: 2px; gap: 2px; }
.seg button { flex: 1; border: 0; background: none; padding: 6px 8px; border-radius: 6px; font-size: 13px; color: var(--muted); }
.seg button.on { background: var(--gold-dim); color: var(--gold); }
.note { font-size: 13px; color: var(--muted); line-height: 1.45; }
.btn { border: 1px solid var(--rule); background: rgba(255, 255, 255, 0.04); border-radius: 8px; padding: 8px 12px; font-size: 14px; display: inline-flex; gap: 8px; align-items: center; }
.btn:hover { border-color: rgba(217, 172, 82, 0.5); }
.btn.primary { background: var(--gold); color: #1a1408; border-color: var(--gold); font-weight: 600; }
.btn svg { width: 16px; height: 16px; stroke: currentColor; fill: none; stroke-width: 1.8; }
.btns { display: flex; flex-wrap: wrap; gap: 8px; }
.legend { display: flex; height: 8px; border-radius: 4px; overflow: hidden; margin: 6px 0 3px; }
.legend + .scale { display: flex; justify-content: space-between; font: 11px var(--font-data); color: var(--faint); }

/* ---------- dossier ---------- */
#card { position: fixed; right: 12px; top: calc(12px + env(safe-area-inset-top, 0px)); z-index: 10; width: 360px; max-height: calc(100vh - 200px); overflow: auto; padding: 18px 18px 16px; display: none; }
#card.open { display: block; }
#card .kind { font: 500 11px/1 var(--font-data); letter-spacing: 0.12em; text-transform: uppercase; color: var(--gold); }
#card h1 { font: 400 32px/1.05 var(--font-display); margin: 8px 0 2px; text-wrap: balance; }
#card .alt { font: italic 16px/1.3 var(--font-display); color: var(--muted); }
#card p { margin: 12px 0; line-height: 1.5; }
#card dl { display: grid; grid-template-columns: auto 1fr; gap: 6px 14px; margin: 14px 0; font-size: 14px; }
#card dt { color: var(--faint); }
#card dd { margin: 0; font-variant-numeric: tabular-nums; min-width: 0; }
#card .mono { font-family: var(--font-data); font-size: 12.5px; }
.wxnow { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; align-items: baseline; padding: 12px 14px; background: rgba(142, 197, 214, 0.07); border: 1px solid rgba(142, 197, 214, 0.18); border-radius: 8px; margin: 12px 0; }
.wxnow .big { font: 400 34px/1 var(--font-display); grid-row: span 2; }
.wxnow .sky { font-weight: 600; }
.wxnow .det { color: var(--muted); font-size: 13px; }
.fc { width: 100%; height: 110px; display: block; margin-top: 6px; }

/* ---------- timeline ---------- */
#timeline { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10; width: min(780px, calc(100vw - 420px)); padding: 10px 16px 12px; display: grid; grid-template-columns: auto 1fr auto; gap: 4px 14px; align-items: center; }
#play { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--rule); background: rgba(255, 255, 255, 0.05); display: grid; place-items: center; grid-row: span 2; }
#play svg { width: 16px; height: 16px; fill: var(--fg); }
#play:hover { border-color: var(--gold); }
#tdate { font: 400 20px/1.1 var(--font-display); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
#tdate em { font-style: italic; color: var(--muted); font-size: 15px; }
#tmeta { display: flex; gap: 8px; align-items: center; justify-content: flex-end; }
#tmeta select { background: rgba(255, 255, 255, 0.05); border: 1px solid var(--rule); border-radius: 6px; padding: 3px 6px; font-size: 13px; color: var(--muted); }
#tmeta select option { background: var(--panel-solid); }
#track { grid-column: 2 / 4; position: relative; height: 24px; }
#track input { position: absolute; inset: 0; width: 100%; margin: 0; background: none; -webkit-appearance: none; appearance: none; height: 24px; }
#track input::-webkit-slider-runnable-track { height: 3px; background: var(--rule); border-radius: 2px; }
#track input::-moz-range-track { height: 3px; background: var(--rule); border-radius: 2px; }
#track input::-webkit-slider-thumb { -webkit-appearance: none; width: 14px; height: 14px; border-radius: 50%; background: var(--gold); margin-top: -5.5px; box-shadow: 0 0 0 4px rgba(217, 172, 82, 0.2); }
#track input::-moz-range-thumb { width: 14px; height: 14px; border-radius: 50%; background: var(--gold); border: 0; }
#ticks { position: absolute; left: 7px; right: 7px; top: 0; height: 24px; pointer-events: none; }
#ticks i { position: absolute; top: 5px; width: 1px; height: 5px; background: var(--muted); opacity: 0.6; }
#ticker { grid-column: 1 / 4; font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-height: 1.3em; }
#ticker b { color: var(--fg); font-weight: 500; }

/* ---------- status + controls ---------- */
#status { position: fixed; left: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 9; font: 11.5px/1.5 var(--font-data); color: var(--muted); padding: 7px 10px; font-variant-numeric: tabular-nums; min-width: 230px; }
#status b { color: var(--fg); font-weight: 400; }
#ctrl { position: fixed; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom, 0px)); z-index: 10; display: flex; flex-direction: column; gap: 6px; align-items: flex-end; }
#ctrl .grp { display: flex; flex-direction: column; padding: 3px; gap: 2px; }
#ctrl button { width: 38px; height: 38px; border: 0; background: none; border-radius: 7px; display: grid; place-items: center; color: var(--muted); font: 600 12px var(--font-data); }
#ctrl button:hover { background: var(--raise); color: var(--fg); }
#ctrl button.on { color: var(--gold); }
#ctrl svg { width: 19px; height: 19px; stroke: currentColor; fill: none; stroke-width: 1.7; stroke-linecap: round; stroke-linejoin: round; }
#compass svg { transition: transform 0.1s linear; }
.maplibregl-ctrl-bottom-right, .maplibregl-ctrl-bottom-left { display: none; }
#scale { position: fixed; left: 14px; bottom: calc(76px + env(safe-area-inset-bottom, 0px)); z-index: 9; font: 11px var(--font-data); color: var(--fg); text-shadow: 0 1px 2px #000; display: flex; flex-direction: column; gap: 3px; pointer-events: none; }
#scale .sbar { height: 5px; border: 1.5px solid var(--fg); border-top: 0; box-shadow: 0 1px 2px rgba(0,0,0,.6); }

<script id="src-gen">/* ============================================================================

  {

    const bn = fbm(X * 0.012 + 50, Y * 0.012 - 30, 4), bl = fbm(X * 0.0045 - 20, Y * 0.0045 + 41, 4);
    const ar = sample1(8, bx, by) * wm, gr = sample1(13, bx, by) * wm;
    F[8] = sat(ar * (0.75 + 1.1 * bl + 0.5 * bn) + 0.15 * bn * ar);

    F[12] = F[12] * (1 + 0.3 * bn);
  }

  const cd = fbmA(X, Y, 28, Math.max(pix * 1.2, 0.0015), 0.92, 1);
  const s = land - 0.5 + cd * 0.2;
  R.s = s; R.stream = 0;
  let h;
  if (s > 0) {
    const inland = sat((cont - 0.5) * 2.2);
    let base = 12 + 250 * inland + 1500 * F[12];
    base += 110 * fbm(X * 0.011, Y * 0.011, 3) * (0.3 + inland);
    // procedural uplands outside the authored world
    if (wm < 1) base += (1 - wm) * 500 * sat(fbm(X * 0.002 + 40, Y * 0.002, 3) + 0.2);
    h = base;
    const hill = F[3];
    if (hill > 0.004) h += hill * 1200 * (0.5 + 0.5 * fbm(X * 0.09 + 40, Y * 0.09, 4));
    if (mtn > 0.002) {
      const r = ridgedA(X, Y, 26, Math.max(pix * 1.1, 0.003));
      const mm = sstep(0, 0.35, mtn) * mtn;
      h += mm * 5200 * (0.12 + 0.88 * Math.pow(r, 1.35));
    }
    // regional roughness: rolling country, low hills, broken ground
    const rough = sat(0.35 + 0.9 * fbm(X * 0.004 + 71, Y * 0.004 - 12, 3));
    h += (25 + 190 * rough) * (0.5 + 0.5 * fbmA(X, Y, 14, Math.max(pix * 1.1, 0.01), 0.75, 3)) * (1 - F[15]);
    h += (12 + 420 * mtn + 140 * hill + 30 * inland) * fbmA(X, Y, 3, Math.max(pix * 1.1, 0.002), 0.8, 2);
    // drainage: a procedural stream network carved into the land
    let str = 0;
    {
      const qx = X * 0.09 + 2.3 * noise(X * 0.03, Y * 0.03), qy = Y * 0.09 + 2.3 * noise(X * 0.03 + 5, Y * 0.03);
      const v1 = 1 - Math.abs(noise(qx, qy));
      const v2 = 1 - Math.abs(noise(qx * 2.3 + 11, qy * 2.3 - 3));
      const w1 = Math.max(0.018, pix * 0.09), w2 = Math.max(0.03, pix * 0.2);
      const s1 = sstep(1 - w1 * 3, 1 - w1 * 0.3, v1), s2 = sstep(1 - w2 * 2, 1 - w2 * 0.2, v2) * 0.6;
      str = Math.max(s1, s2) * (1 - sstep(0.3, 0.7, F[8])) * (1 - F[10]) * sstep(0.35, 0.08, pix) * sstep(-0.25, 0.25, noise(X * 0.04 + 7, Y * 0.04 - 3));
      const cv1 = sstep(0.45, 1, v1), cv2 = sstep(0.6, 1, v2);
      h -= (5 + 30 * rough + 70 * hill + 160 * mtn) * Math.max(cv1 * cv1, 0.5 * cv2 * cv2);
    }
    R.stream = str;
    h *= sstep(0, 0.07, s);
    const v = F[11];
    if (v > 0.01) { const floor = Math.min(h, base * 0.75 + 6); h += (floor - h) * sstep(0, 0.8, v); }
    const lk = F[15];
    if (lk > 0.05) h = mix(h, base * 0.7 - 4, sstep(0.15, 0.55, lk));
    for (let k = 0; k < FLATS.length; k++) {
      const f = FLATS[k];
      const dx = X - f.x, dy = Y - f.y;
      if (dx > f.r || dx < -f.r || dy > f.r || dy < -f.r) continue;
      const d = Math.sqrt(dx * dx + dy * dy) / f.r;
      if (d < 1) { const t = sstep(1, 0.2, d) * 0.85; h = mix(h, Math.min(h, base + f.lift + (h - base) * 0.25), t); str *= 1 - t; R.stream = str; }
    }
    if (PEAKS.length) h += peakAt(X, Y, pix);
    R.base = base;
    if (h < 0.6) h = 0.6;
  } else {
    const shelf = sstep(0, 0.1, -s);
    const deep = sstep(0.36, 0.08, cont);
    h = -4 - 150 * shelf - 3900 * deep * (0.6 + 0.4 * shelf);
    h += 320 * fbm(X * 0.005 + 3, Y * 0.005, 4) * deep;
    // a mid-ocean ridge running down the Great Sea
    const rdg = Math.exp(-Math.pow((X + 900 + 120 * Math.sin(Y * 0.004)) / 90, 2));
    h += rdg * 1900 * (0.7 + 0.3 * noise(X * 0.02, Y * 0.02)) * deep;
    const nf = numenorField(X, Y);
    if (nf > 0) {
      const top = -520 + 260 * fbm(X * 0.02, Y * 0.02, 3);
      h = mix(h, Math.max(h, top), nf);
      const dm = Math.hypot(X - NUM.cx, Y - NUM.cy);
      if (dm < 22) h = Math.max(h, -60 - dm * 18);
    }
    R.base = 0;
  }
  R.h = h; R.mtn = mtn;
  return h;
}

/* ---------------- climate ---------------- */
function tempAt(lat, h) {
  const c = Math.cos(Math.abs(lat) * D2R);
  return 34 * Math.pow(c, 1.5) - 9 - 0.0065 * Math.max(h, 0);
}
function moistAt(X, Y, lat, wm) {
  const alat = Math.abs(lat);
  let m = 0.62 - 0.6 * F[8] + 0.25 * F[7] + 0.12 * F[4] - 0.22 * sat((F[1] - 0.6) * 2.4);
  m += 0.2 * fbm(X * 0.004 + 9, Y * 0.004, 3) + 0.22 * fbm(X * 0.0013 - 17, Y * 0.0013 + 5, 3);
  if (wm < 1) {
    let g = 0.55 + 0.35 * fbm(X * 0.0025 - 4, Y * 0.0025, 3);
    g -= 0.45 * Math.exp(-Math.pow((alat - 24) / 8, 2));
    g += 0.3 * Math.exp(-Math.pow(alat / 9, 2));
    g -= 0.2 * sat((F[1] - 0.65) * 3);
    m = m * wm + g * (1 - wm);
  }
  return sat(m);
}

/* ---------------- colour ---------------- */
const tmp3 = [0, 0, 0];
function setc(r, g, b) { tmp3[0] = r; tmp3[1] = g; tmp3[2] = b; }
function blend(r, g, b, t) { tmp3[0] += (r - tmp3[0]) * t; tmp3[1] += (g - tmp3[1]) * t; tmp3[2] += (b - tmp3[2]) * t; }

// farmland: Voronoi parcels subdivided into strip fields, with hedgerows
const FC = [[190,170,112],[170,152,104],[150,140,96],[104,124,66],[88,112,58],[124,104,78],[112,92,70],[140,134,90],[96,116,64],[118,128,74]];
function fields(X, Y, cell, pix, hobbit) {
  // a rotated grid of blocks; each block split into strips of varying width
  const th = 0.6 * noise(X * 0.05 + 11, Y * 0.05 - 7) + (hobbit ? 0.3 : 0.9);
  const c = Math.cos(th), s = Math.sin(th);
  let u = (X * c + Y * s) / cell, v = (-X * s + Y * c) / cell;
  u += 0.18 * noise(u * 0.35, v * 0.35); v += 0.18 * noise(u * 0.35 + 5, v * 0.35 - 3);
  const bi = Math.floor(u), bj = Math.floor(v * 0.7);
  const fu = u - bi, fv = v * 0.7 - bj;
  const pid = hash2(bi, bj, 11);
  const vert = hash2(bi, bj, 13) < 0.5;
  const ns = 1 + Math.floor(hash2(bi, bj, 15) * (hobbit ? 3 : 5));
  const q = vert ? fu : fv;
  const sid = Math.floor(q * ns);
  const k = hash2(sid + bi * 7, bj, 17);
  let col;
  if (pid < 0.3) col = FC[3 + Math.floor(k * 2)];
  else col = FC[Math.floor(k * FC.length)];
  const eu = Math.min(fu, 1 - fu) * cell, ev = Math.min(fv, 1 - fv) * cell / 0.7;
  const es = Math.min(q * ns - sid, sid + 1 - q * ns) / ns * cell * (vert ? 1 : 1 / 0.7);
  const edge = Math.min(eu, ev);
  const hedgeW = hobbit ? 0.006 : 0.004;
  let hedge = edge < hedgeW + pix * 0.5 ? sat(1 - (edge - hedgeW) / (pix + 1e-6)) : 0;
  if (es < 0.0015 + pix * 0.5 && pid >= 0.3 && pix < 0.006) hedge = Math.max(hedge, 0.2 * sat(1 - (es - 0.0015) / (pix + 1e-6)));
  const tram = (pix < cell * 0.03) ? 0.05 * Math.sin((vert ? fv : fu) * cell / 0.004) : 0;
  const trees = hedge > 0.5 && hash2(Math.floor(X / 0.007), Math.floor(Y / 0.007), 21) < 0.3 ? 1 : 0;
  return [col[0] * (1 + tram), col[1] * (1 + tram), col[2] * (1 + tram), hedge, trees];
}

// tree crowns at high zoom: returns light factor (−1 gap … +1 sunlit crown)
function canopy(X, Y, spacing) {
  const gx = X / spacing, gy = Y / spacing;
  const ix = Math.floor(gx), iy = Math.floor(gy);
  let best = 9, lx = 0, ly = 0, rad = 0.5;
  for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) {
    const cx = ix + i, cy = iy + j;
    const px = cx + hash2(cx, cy, 21), py = cy + hash2(cx, cy, 23);
    const r = 0.45 + 0.35 * hash2(cx, cy, 25);
    const dx = gx - px, dy = gy - py;
    const d = Math.sqrt(dx * dx + dy * dy) / r;
    if (d < best) { best = d; lx = dx / r; ly = dy / r; rad = r; }
  }
  if (best > 1) return -1;
  // sun from the north-west: lit where (−x,+y)
  const lit = (-lx * 0.6 + ly * 0.6) * 0.8 + 0.25 * (1 - best);
  return clamp(lit, -0.9, 1);
}

/* colour at a point, using F/R from the evaluate() just done.
   mode: 0 satellite, 1 parchment, 2 hypsometric.  shade = hillshade factor. */
function colorAt(X, Y, h, slope, pix, mode, dsea) {
  const lat = R.lat, s = R.s, wm = R.wm;
  if (mode === 1) return parchmentColor(X, Y, h, slope, pix, dsea);
  if (mode === 2) return hypsoColor(X, Y, h, slope, pix);
  if (s <= 0) {
    // ---- ocean ----
    const depth = -h;
    const t1 = sstep(0, 60, depth), t2 = sstep(40, 400, depth), t3 = sstep(300, 3500, depth);
    const warm = sstep(18, 26, tempAt(lat, 0));
    setc(mix(70, 30, 0) + warm * 20, 150 + warm * 20, 150 + warm * 20);
    blend(26, 86, 110, t1);
    blend(16, 52, 84, t2);
    blend(9, 26, 54, t3);
    const n = fbmA(X, Y, 20, Math.max(pix, 0.003), 0.7, 5);
    tmp3[0] *= 1 + 0.05 * n; tmp3[1] *= 1 + 0.06 * n; tmp3[2] *= 1 + 0.05 * n;
    const ice = F[14];
    if (ice > 0.05) {
      const floe = fbmA(X, Y, 8, Math.max(pix, 0.002), 0.9, 8);
      const cov = sstep(0.1, 0.6, ice + 0.4 * floe);
      blend(222, 230, 238, cov * 0.95);
    }
    const lake = F[15];
    if (lake > 0.4 && depth < 5) blend(24, 58, 74, 0.8);
    if (depth < 3 && pix < 0.01) blend(210, 214, 206, sat(1 - depth / 3) * 0.35);
    return tmp3;
  }
  const T = tempAt(lat, h);
  const Mst = moistAt(X, Y, lat, wm);
  const arid = F[8];
  // ---- base ground ----
  const veg = sat(Mst * 1.35 - 0.15);
  setc(134, 124, 84);                            // dry steppe
  blend(68, 90, 42, veg);                        // lush grass
  if (T > 18) blend(158, 142, 82, sat((T - 18) / 6) * (1 - veg) * 0.8);   // savanna
  if (T > 20 && Mst > 0.7) blend(38, 70, 32, sat((Mst - 0.7) * 4) * sat((T - 20) / 4)); // jungle
  if (T < 3) blend(122, 118, 92, sat((3 - T) / 5));   // tundra
  const g = F[13];
  if (g > 0.02) {
    const gp = fbmA(X, Y, 1.5, Math.max(pix * 1.3, 0.004), 0.75, 51);
    blend(158 + 18 * gp, 144 + 10 * gp, 84, g * 0.5);
    blend(96, 112, 60, g * sat(-gp * 1.8) * 0.5);
  }
  // landcover variety: scrub, heath, bare ground, riparian green
  const lc1 = fbm(X * 0.05 + 21, Y * 0.05 - 4, 4), lc2 = fbmA(X, Y, 1.2, Math.max(pix * 1.5, 0.004), 0.6, 30);
  blend(120, 112, 74, sat(lc1 * 1.6) * 0.28);                  // dry grass patches
  blend(54, 76, 38, sat(-lc1 * 1.6) * 0.45 * veg);             // lush hollows
  blend(112, 96, 78, sat((F[3] + sat(h / 1500)) * 0.8) * sat(lc2 + 0.2) * 0.45);   // heath on hills
  const lv = lc2 * 0.1 + 0.07 * fbm(X * 0.012 - 30, Y * 0.012 + 8, 3) + 0.07 * fbmA(X, Y, 3, Math.max(pix * 1.5, 0.01), 0.7, 33); tmp3[0] *= 1 + lv; tmp3[1] *= 1 + lv * 0.9; tmp3[2] *= 1 + lv * 0.7;
  if (R.stream > 0) blend(56, 78, 40, R.stream * 0.55 * veg + 0.1 * R.stream);
  // alpine grassland and mountain rock tones by elevation
  const alp = sstep(900, 2200, h);
  if (alp > 0) blend(126, 118, 92, alp * 0.55);
  // arid / desert
  const hot = sstep(9, 19, T);
  let desert = sat(arid * 1.1 - 0.05);
  if (wm < 1) desert = Math.max(desert, sat((0.32 - Mst) * 3) * (1 - wm));
  if (desert > 0.01) {
    const dn = fbm(X * 0.02, Y * 0.02, 3);
    const dr = 212 + 18 * dn, dg = 178 + 10 * dn, db = 120;
    const cr = 132, cg = 112, cb = 82;
    blend(mix(cr, dr, hot), mix(cg, dg, hot), mix(cb, db, hot), desert);
    if (hot > 0.5 && desert > 0.6 && pix < 0.2) {
      const dune = Math.abs(noise(X * 0.9 + noise(X * 0.1, Y * 0.1) * 2, Y * 0.35));
      const dl = (dune - 0.35) * 0.18 * sat((0.2 - pix) * 6);
      tmp3[0] *= 1 + dl; tmp3[1] *= 1 + dl; tmp3[2] *= 1 + dl;
    }
  }
  // farmland
  const farm = F[9];
  if (farm > 0.03) {
    const hob = F[9] > 0.85 && Math.abs(Y) < 120 && X > -80 && X < 70;
    const cell = hob ? 0.2 : 0.34;
    const pf = sstep(0.25, 0.6, farm + 0.35 * fbm(X * 0.08 + 3, Y * 0.08, 3));
    const favg = 0.5 * pf;
    if (pix < cell * 0.22) {
      const f = fields(X, Y, cell, pix, hob);
      const t = sat((cell * 0.22 - pix) / (cell * 0.12)) * pf;
      blend(118, 128, 76, favg * (1 - t));
      const k = 0.4 + 0.6 * sat((cell * 0.08 - pix) / (cell * 0.05));
      blend(118 + (f[0] - 118) * k, 128 + (f[1] - 128) * k, 76 + (f[2] - 76) * k, t * 0.85);
      if (f[3] > 0) blend(f[4] ? 44 : 70, f[4] ? 62 : 86, f[4] ? 34 : 48, f[3] * t * 0.85 * sat((0.012 - pix) / 0.006));
    } else {
      blend(118, 128, 76, favg);
      const fn = fbm(X / cell * 0.8, Y / cell * 0.8, 3);
      tmp3[0] *= 1 + 0.08 * fn * pf; tmp3[1] *= 1 + 0.06 * fn * pf;
    }
  }
  // natural woodland and forests
  let fd = F[4];
  if (farm > 0.2) fd = Math.max(fd, sstep(0.42, 0.5, fbm(X * 0.9 + 3, Y * 0.9 - 8, 3) + 0.15 * noise(X * 6, Y * 6)) * 0.9 * sat(farm));
  const temperate = sstep(-4, 3, T) * (1 - sstep(24, 30, T));
  const wild = sstep(0.1, 0.55, fbm(X * 0.03 + 7, Y * 0.03, 4) + 0.35 * (Mst - 0.5)) * Mst * 0.7 * temperate * (1 - arid) * (1 - F[9] * 0.8) * (1 - g * 0.9);
  fd = Math.max(fd * (0.7 + 0.3 * sat(Mst + 0.3)), wild * (wm < 1 ? 1 : 0.55));
  const treeline = 2600 - Math.max(0, Math.abs(lat) - 40) * 55;
  fd *= sstep(treeline, treeline - 500, h);
  fd *= 1 - sstep(0.55, 0.9, slope) * 0.6;
  if (fd > 0.01) {
    const conifer = sat(sstep(8, 1, T + 0.004 * 0) + sstep(treeline - 1200, treeline - 400, h));
    let fr = mix(50, 30, conifer), fg = mix(70, 50, conifer), fb = mix(36, 34, conifer);
    const dk = F[6];
    if (dk > 0) { fr = mix(fr, 22, dk); fg = mix(fg, 36, dk); fb = mix(fb, 24, dk); }
    const gold = F[5];
    if (gold > 0) { const gm = gold * (0.35 + 0.35 * sat(0.5 + fbm(X * 0.6, Y * 0.6, 3))); fr = mix(fr, 168, gm); fg = mix(fg, 140, gm); fb = mix(fb, 52, gm); }
    if (T > 22) { fr *= 0.8; fg *= 1.05; }
    const mott = fbmA(X, Y, 0.6, Math.max(pix, 0.002), 0.7, 9);
    fr *= 1 + 0.12 * mott; fg *= 1 + 0.14 * mott; fb *= 1 + 0.1 * mott;
    let dens = sstep(0.3, 0.52, fd + 0.28 * fbmA(X, Y, 4, Math.max(pix, 0.003), 0.8, 40));
    if (pix < 0.008) {
      const c = canopy(X, Y, gold > 0.5 ? 0.012 : 0.0065);
      const gap = c < -0.5;
      const lit = 1 + 0.32 * c * sat((0.008 - pix) / 0.004);
      if (gap) dens *= sat(1 - (0.8 - fd) * 1.5);
      fr *= lit; fg *= lit; fb *= lit;
    }
    blend(fr, fg, fb, dens);
  }
  // marsh
  const marsh = F[7];
  if (marsh > 0.02) {
    blend(74, 84, 52, marsh * 0.8);
    const pools = fbmA(X, Y, 0.8, Math.max(pix, 0.002), 0.8, 12);
    if (pools > 0.18) blend(46, 64, 62, sat((pools - 0.18) * 6) * marsh);
  }
  // ash and slag of Mordor
  const ash = F[10];
  if (ash > 0.02) {
    const an = fbm(X * 0.08, Y * 0.08, 4);
    const af = sstep(0.25, 0.55, ash + 0.3 * fbmA(X, Y, 6, Math.max(pix, 0.003), 0.8, 44));
    blend(62 + 12 * an, 57 + 10 * an, 54 + 8 * an, af * 0.94);
    const dO = Math.hypot(X - 860, Y + 565);
    if (dO < 30) {
      const flows = Math.abs(noise(Math.atan2(Y + 565, X - 860) * 6, dO * 0.25));
      if (flows < 0.07) blend(98, 34, 16, (1 - flows / 0.07) * sat(1 - dO / 30) * 0.9);
      blend(40, 36, 36, sat(1 - dO / 12) * 0.6);
    }
  }
  // alpine: rock on steep slopes and high ground, snow above the snowline
  const rock = Math.max(sstep(0.5, 0.95, slope), sstep(treeline + 200, treeline + 900, h) * 0.85);
  if (rock > 0.01) {
    const rn = fbm(X * 0.3, Y * 0.3, 3);
    const dark = ash > 0.3 ? 0.55 : 0;
    blend(mix(124, 70, dark) + 14 * rn, mix(114, 64, dark) + 12 * rn, mix(104, 60, dark) + 10 * rn, rock);
  }
  const Tsnow = T + 8.5 + 8 * slope;
  let snow = sstep(-1, -4.5, Tsnow);
  snow = Math.max(snow, F[14] * 0.9 * sstep(0.2, 0.7, F[14] + 0.3 * fbm(X * 0.05, Y * 0.05, 3)));
  if (snow > 0.01) {
    const sn = fbmA(X, Y, 2, Math.max(pix, 0.002), 0.8, 14);
    snow = sat(snow + sn * 0.35 * snow);
    blend(238, 242, 247, snow);
  }
  // beaches
  if (s < 0.025 && h < 8 && slope < 0.5) blend(204, 190, 152, sat(1 - s / 0.025) * 0.8);
  // lakes at coarse scale
  if (F[15] > 0.55 && pix > 0.3) blend(26, 58, 74, sstep(0.55, 0.75, F[15]));
  return tmp3;
}

function hypsoColor(X, Y, h, slope, pix) {
  if (R.s <= 0) {
    const t = sstep(0, 4000, -h);
    setc(mix(174, 88, t), mix(208, 140, t), mix(226, 190, t));
    return tmp3;
  }
  const stops = [[0, 112, 160, 106], [150, 150, 188, 118], [400, 206, 214, 150], [800, 226, 206, 150], [1500, 196, 160, 116], [2500, 168, 128, 102], [3500, 206, 200, 196], [5000, 250, 250, 252]];
  let i = 0; while (i < stops.length - 2 && h > stops[i + 1][0]) i++;
  const a = stops[i], b = stops[i + 1];
  const t = sat((h - a[0]) / (b[0] - a[0]));
  setc(mix(a[1], b[1], t), mix(a[2], b[2], t), mix(a[3], b[3], t));
  if (F[4] > 0.2) blend(116, 150, 96, F[4] * 0.4);
  return tmp3;
}

function parchmentColor(X, Y, h, slope, pix, dsea) {
  const stain = fbm(X * 0.02 + 4, Y * 0.02, 4) * 0.5 + fbmA(X, Y, 0.6, Math.max(pix, 0.004), 0.6, 20) * 0.25;
  setc(236 + 10 * stain, 222 + 12 * stain, 188 + 14 * stain);
  if (R.s <= 0) {
    blend(214, 214, 196, 0.45);
    // ripple lines hugging the coast
    if (dsea !== undefined && dsea > 0) {
      const k = dsea / Math.max(pix, 0.2);
      const ln = [4, 9, 16];
      for (let i = 0; i < 3; i++) if (Math.abs(k - ln[i]) < 0.7) blend(96, 102, 102, 0.55 - i * 0.12);
    }
    return tmp3;
  }
  if (dsea !== undefined && dsea > -1.4 && dsea < 0.001) blend(66, 48, 34, 0.9);
  if (F[4] > 0.2) {
    blend(170, 184, 128, sat(F[4] - 0.1) * 0.55);
    if (pix < 3) {
      const gx = X / (pix * 6), gy = Y / (pix * 6);
      const ix = Math.floor(gx), iy = Math.floor(gy);

    const d = dens[jj * nC + ii] * (1 - fx) * (1 - fy) + dens[jj * nC + ii + 1] * fx * (1 - fy) + dens[(jj + 1) * nC + ii] * (1 - fx) * fy + dens[(jj + 1) * nC + ii + 1] * fx * fy;
    if (GEN.hash2(i + m.seed, j, 7) > d) continue;
    trees.push(ex, ny, kind[jj * nC + ii], 0.7 + 0.6 * GEN.hash2(i, j + m.seed, 9));
  }
  return new Float32Array(trees);
}

/* ---------- weather ---------- */
function wxInit(m) {
  const { W, H, lon0, lon1, lat0, lat1, GW, GH } = m;
  const my0 = merc(lat1), my1 = merc(lat0);
  const latOf = v => (2 * Math.atan(Math.exp(my0 + (my1 - my0) * v)) - Math.PI / 2) * 180 / Math.PI;
  const st = [];
  const hs = new Float32Array(GW * GH);
  const pos = [];
  for (let j = 0; j < GH; j++) {
    const lat = latOf((j + 0.5) / GH);
    for (let i = 0; i < GW; i++) {
      const lon = lon0 + (lon1 - lon0) * (i + 0.5) / GW;
      const [X, Y] = GEN.toXY(lon, lat);
      const h = GEN.evaluate(X, Y, 8);
      const F = GEN.F;
      st.push({ X, Y, lat, lon, h: Math.max(0, h), land: GEN.R.s > 0 ? 1 : 0, arid: F[8], cont: GEN.sat((F[1] - 0.45) * 2), mtn: F[2], gx: 0, gy: 0 });
      hs[j * GW + i] = Math.max(0, h);
    }
  }
  for (let j = 0; j < GH; j++) for (let i = 0; i < GW; i++) {
    const s = st[j * GW + i];
    const il = Math.max(0, i - 1), ir = Math.min(GW - 1, i + 1), ju = Math.max(0, j - 1), jd = Math.min(GH - 1, j + 1);
    const dxm = (st[j * GW + ir].X - st[j * GW + il].X) * GEN.MI || 1, dym = (st[ju * GW + i].Y - st[jd * GW + i].Y) * GEN.MI || 1;
    s.gx = (hs[j * GW + ir] - hs[j * GW + il]) / dxm;
    s.gy = (hs[ju * GW + i] - hs[jd * GW + i]) / dym;
  }
  // per-pixel X,Y for the render canvas
  const PX = new Float32Array(W * H), PY = new Float32Array(W * H), LAT = new Float32Array(H);
  for (let j = 0; j < H; j++) {
    const lat = latOf((j + 0.5) / H); LAT[j] = lat;
    for (let i = 0; i < W; i++) {
      const lon = lon0 + (lon1 - lon0) * (i + 0.5) / W;
      const p = GEN.toXY(lon, lat);
      PX[j * W + i] = p[0]; PY[j * W + i] = p[1];
    }
  }
  WXS = { ...m, st, PX, PY, LAT };
}

const TRAMP = [[-30, 150, 90, 200], [-15, 110, 110, 220], [-5, 90, 150, 230], [0, 150, 200, 240], [5, 110, 200, 170], [12, 150, 220, 110], [18, 230, 220, 100], [24, 240, 170, 70], [30, 230, 100, 60], [40, 150, 30, 60]];
function tcol(T) {
  let i = 0; while (i < TRAMP.length - 2 && T > TRAMP[i + 1][0]) i++;
  const a = TRAMP[i], b = TRAMP[i + 1], t = GEN.sat((T - a[0]) / (b[0] - a[0]));
  return [a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t, a[3] + (b[3] - a[3]) * t];
}
function rcol(R, snow) {
  if (snow > 0.5) {
    if (R < 0.5) return [170, 200, 240, 150]; if (R < 2) return [120, 150, 240, 190]; return [170, 110, 230, 220];
  }
  if (R < 0.4) return [90, 200, 110, 140]; if (R < 1.5) return [40, 170, 60, 180]; if (R < 3) return [230, 220, 60, 200]; if (R < 6) return [240, 140, 40, 220]; return [220, 40, 50, 230];
}

function wxFrame(m) {
  const S = WXS; if (!S) return null;
  const t = m.t, sys = WX.systems(t);
  const { GW, GH, W, H, st } = S;
  const N = GW * GH;
  const C = new Float32Array(N), R = new Float32Array(N), T = new Float32Array(N), P = new Float32Array(N), U = new Float32Array(N), V = new Float32Array(N), SN = new Float32Array(N), DK = new Float32Array(N);
  for (let k = 0; k < N; k++) {
    const s = st[k];
    const o = WX.sample(s.X, s.Y, t, s, sys, m.lore);
    C[k] = o.C; R[k] = o.R; T[k] = o.T; P[k] = o.P; U[k] = o.u; V[k] = o.v; SN[k] = o.snow; DK[k] = o.dark;
  }
  const bil = (A, u, v) => {
    const x = u * GW - 0.5, y = v * GH - 0.5;
    const ix = Math.max(0, Math.min(GW - 2, Math.floor(x))), iy = Math.max(0, Math.min(GH - 2, Math.floor(y)));
    const fx = GEN.sat(x - ix), fy = GEN.sat(y - iy), k = iy * GW + ix;
    return (A[k] * (1 - fx) + A[k + 1] * fx) * (1 - fy) + (A[k + GW] * (1 - fx) + A[k + GW + 1] * fx) * fy;
  };
  const res = { id: m.id, t, U, V, GW, GH, sys: sys.filter(s => !s.fixed && s.env > 0.35).map(s => ({ type: s.type, x: s.x, y: s.y })), layers: {} };
  const L = m.layers;
  const transfers = [];
  const drift = t * 420;
  if (L.clouds || L.radar) {
    const cl = L.clouds ? new Uint8ClampedArray(W * H * 4) : null;
    const rd = L.radar ? new Uint8ClampedArray(W * H * 4) : null;
    for (let j = 0; j < H; j++) {
      const v = (j + 0.5) / H;
      for (let i = 0; i < W; i++) {
        const u = (i + 0.5) / W, k = j * W + i;
        const X = S.PX[k], Y = S.PY[k];
        const c = bil(C, u, v), r = bil(R, u, v);
        const det = GEN.fbm((X - drift) / 70, (Y + t * 40) / 70, 5);
        const o = k * 4;
        if (cl) {
          let d = GEN.sat((c - 0.4) * 2.3 + 0.62 * det + 0.1);
          d = d * d * (3 - 2 * d);
          const grey = 250 - 70 * GEN.sat(r / 5) - 25 * GEN.sat(det);
          const dk = bil(DK, u, v);
          const edge = Math.min(i, W - 1 - i, j, H - 1 - j) / 40;
          const a = Math.max(d * 0.93, dk * 0.88) * (edge < 1 ? edge * edge * (3 - 2 * edge) : 1);
          const mixd = dk > d ? 1 : dk / (d + 1e-3) * 0.5;
          cl[o] = grey * (1 - mixd) + 44 * mixd; cl[o + 1] = grey * (1 - mixd) + 34 * mixd; cl[o + 2] = grey * (1 - mixd) + 30 * mixd; cl[o + 3] = a * 255;
        }
        if (rd && r > 0.05) {
          const cell = GEN.sat(0.55 + 0.9 * GEN.fbm((X - drift) / 22, (Y + t * 40) / 22, 3));
          const I = r * (0.4 + 1.2 * cell);
          if (I > 0.12) { const col = rcol(I, bil(SN, u, v)); rd[o] = col[0]; rd[o + 1] = col[1]; rd[o + 2] = col[2]; rd[o + 3] = col[3]; }
        }
      }
    }
    if (cl) res.layers.clouds = cl;
    if (rd) res.layers.radar = rd;
  }
  if (L.temp) {
    const tp = new Uint8ClampedArray(W * H * 4);
    for (let j = 0; j < H; j++) for (let i = 0; i < W; i++) {
      const k = j * W + i, o = k * 4;
      const c = tcol(bil(T, (i + 0.5) / W, (j + 0.5) / H));
      tp[o] = c[0]; tp[o + 1] = c[1]; tp[o + 2] = c[2]; tp[o + 3] = 150;
    }
    res.layers.temp = tp;
  }
  for (const k in res.layers) transfers.push(res.layers[k].buffer);
  if (L.pressure) { res.P = P; }
  res.T = T; res.C = C; res.R = R;
  return { res, transfers };
}

/* Global low-detail cloud field for the rest of the planet. */
function globalClouds(m) {
  const { W, H, t } = m;
  const out = new Uint8ClampedArray(W * H * 4);
  const w = WX.winterness(t);
  for (let j = 0; j < H; j++) {
    const my = Math.PI * (1 - 2 * (j + 0.5) / H) * 0.93;
    const lat = Math.atan(Math.sinh(my)) * 180 / Math.PI;
    const al = Math.abs(lat);
    const band = 0.55 * Math.exp(-Math.pow((lat - 6 + 8 * w) / 7, 2)) + 0.45 * Math.exp(-Math.pow((al - 55) / 12, 2)) - 0.35 * Math.exp(-Math.pow((al - 25) / 8, 2));
    for (let i = 0; i < W; i++) {
      const lon = (i + 0.5) / W * 360 - 180;
      const x = lon * 0.35 - t * (al > 35 ? 5 : -2.5), y = lat * 0.35;
      const n = GEN.fbm(x * 0.35, y * 0.5, 6);
      let d = GEN.sat((band + 0.3 + 0.9 * n - 0.35) * 2.2);
      d = d * d * (3 - 2 * d);
      const o = (j * W + i) * 4;
      const g = 246 - 30 * GEN.sat(n);
      out[o] = g; out[o + 1] = g; out[o + 2] = g + 4; out[o + 3] = d * 235;
    }
  }
  return out;
}

self.onmessage = async (e) => {
  const m = e.data;
  try {
    if (m.type === 'init') { GEN.init(m.data); self.postMessage({ id: m.id, ok: 1 }); return; }
    if (m.type === 'dem') { const b = await demTile(m); self.postMessage({ id: m.id, bmp: b }, [b]); return; }
    if (m.type === 'img') { const b = await imgTile(m); self.postMessage({ id: m.id, bmp: b }, [b]); return; }
    if (m.type === 'ph') { const r = patchHeights(m); self.postMessage({ id: m.id, h: r.h, water: r.water }, [r.h.buffer, r.water.buffer]); return; }
    if (m.type === 'pt') { const b = await patchTexture(m); self.postMessage({ id: m.id, bmp: b }, [b]); return; }
    if (m.type === 'trees') { const t = patchTrees(m); const b = GEN.buildingsNear(m.X, m.Y, m.bHalf / GEN.MI); self.postMessage({ id: m.id, trees: t, buildings: b }, [t.buffer]); return; }
    if (m.type === 'wxinit') { wxInit(m); self.postMessage({ id: m.id, ok: 1 }); return; }
    if (m.type === 'wx') { const r = wxFrame(m); self.postMessage(r.res, r.transfers); return; }
    if (m.type === 'gclouds') { const c = globalClouds(m); self.postMessage({ id: m.id, rgba: c }, [c.buffer]); return; }
  } catch (err) {
    self.postMessage({ id: m.id, error: String(err && err.stack || err) });
  }
};

  begin(); lines(GEO.HILLS, f => f.w / RES, f => f.h / 1200); ch[3] = boxBlur(grab(), W, H, 2, 2);

  begin(); polys(GEO.FARMS, f => f.v); ch[9] = boxBlur(grab(), W, H, 2, 2);
  begin(); polys(GEO.ASH, f => f.v); ch[10] = boxBlur(grab(), W, H, 2, 2);

    main: { W, H, x0: X0, y1: Y1, res: RES, ch },
    glob: { W: GW, H: GH, ch: [boxBlur(G0, GW, GH, 1, 1), G1, boxBlur(G2, GW, GH, 1, 1), boxBlur(G3, GW, GH, 1, 1)] },
    peaks: GEO.PEAKS.map(p => ({ x: p.x, y: p.y, h: p.h, r: p.r, kind: p.kind })),
    flats: GEO.PLACES.filter(p => p[7] && p[7].r >= 0.3 && p[7].culture !== 'minastirith').map(p => ({ x: p[2], y: p[3], r: p[7].r * 1.6 + 0.3, lift: p[7].culture === 'hobbit' ? 30 : 20 })),
    numenor: GEO.NUMENOR,
    vectors: {
      rivers: GEO.RIVERS.map(r => ({ name: r.name, pts: r.pts, w0: r.w0, w1: r.w1 })),
      roads: GEO.ROADS.map(r => ({ name: r.name, pts: r.pts, cls: r.cls })),
      lakes: GEO.LAKES.map(l => ({ pts: l.pts })),
      walls: GEO.WALLS.map(w => ({ name: w.name, pts: w.pts, circle: w.circle })),
      settlements: GEO.PLACES.filter(p => p[7] && p[7].culture && p[7].r).map(p => ({ name: p[0], x: p[2], y: p[3], r: p[7].r, culture: p[7].culture })),

})();

  const el = WX.sunVector(S.t, c.lng, c.lat).el;
  const day = GEN.sat((el + 4) / 14), dusk = Math.max(0, 1 - Math.abs(el - 1) / 7);

/* ---------------- sound focus ---------------- */
function moodAt(X, Y, zoom) {
  if (zoom < 3.2) return 'world';
  GEN.evaluate(X, Y, 1);
  if (GEN.R.s <= 0) return zoom < 6 && Math.hypot(X - 400, Y + 300) < 900 ? 'wild' : 'sea';
  const mtn = GEN.F[2];
  const inR = n => { const r = GEO.REALMS.TA3018.find(r => r.name === n); return r && inPoly(X, Y, r); };
  if (inR('Mordor') || inR('Dol Guldur') || inR('Isengard') || Math.hypot(X - 392, Y - 322) < 70) return 'mordor';
  if (['Lindon', 'Imladris', 'Lothlórien', 'Woodland Realm'].some(inR)) return 'elven';
  if (Math.hypot(X - 426, Y + 164) < 30 || inR('Erebor & Dale') || inR('Iron Hills') || mtn > 0.35) return 'dwarf';
  if (inR('The Shire') || inR('Buckland') || inR('Bree-land')) return 'shire';
  if (inR('Rohan')) return 'rohan';
  if (inR('Gondor')) return 'gondor';
  return 'wild';
}
function soundFocus() {
  const A = window.ARDA_AUDIO; if (!A || !A.on) return;
  let X, Y, t = S.t, near;
  const G = window.GROUND && window.GROUND.G;
  if (G && G.active) { X = G.X0 + G.px / GEN.MI; Y = G.Y0 - G.pz / GEN.MI; t = G.t; near = 1; }
  else { const c = map.getCenter(); [X, Y] = GEN.toXY(c.lng, c.lat); near = GEN.sat((map.getZoom() - 5) / 6) * 0.8; }
  const key = S.moodLock || moodAt(X, Y, G && G.active ? 12 : map.getZoom());
  A.setMood(key);
  const w = weatherAt(X, Y, t);
  GEN.evaluate(X, Y, 0.05);
  const [lon, lat] = GEN.toLL(X, Y);
  A.setWeather({ ...w, day: WX.sunVector(t, lon, lat).el > 0, land: GEN.R.s > 0, forest: GEN.F[4] > 0.4 });
  A.setNear(near);
  const el = $('#sndNow'); if (el) { el.textContent = A.MOODS[key].title; $('#sndWhere').textContent = S.moodLock ? 'Theme chosen by you' : 'Following the map'; }
}

let sel = -1, hits = [];

/* ---------------- identify & dossier ---------------- */
const card = $('#card');
let cardState = null;
function biomeAt(X, Y) {
  const h = GEN.evaluate(X, Y, 0.3), F = GEN.F;
  if (GEN.R.s <= 0) return { name: h < -1000 ? 'Open sea' : 'Coastal waters', h };
  if (F[15] > 0.5) return { name: 'Lake', h };
  const inF = GEO.FORESTS.find(f => inPoly(X, Y, f)), inM = GEO.MARSHES.find(m => inPoly(X, Y, m));
  if (inM) return { name: 'Marsh · ' + inM.name, h };
  if (inF && F[4] > 0.4) return { name: 'Forest · ' + inF.name, h };
  if (F[10] > 0.4) return { name: 'Ash plain and slag', h };
  if (h > 2600) return { name: 'High mountains, snow and rock', h };
  if (F[2] > 0.25) return { name: 'Mountain slopes', h };
  if (F[8] > 0.6) return { name: GEN.tempAt(GEN.R.lat, h) > 15 ? 'Desert' : 'Dry waste', h };
  if (F[9] > 0.4) return { name: 'Farmland', h };
  if (F[13] > 0.5) return { name: 'Grassland', h };
  if (F[3] > 0.2) return { name: 'Downs and heath', h };
  return { name: 'Wild grass and scrub', h };
}
function realmAt(X, Y) { const r = GEO.REALMS[S.era].find(r => inPoly(X, Y, r)); return r ? r.name : '—'; }
function adminAt(X, Y) { const a = GEO.ADMIN.find(a => inPoly(X, Y, a)); return a ? a.name : null; }
function peopleAt(X, Y) { const p = GEO.PEOPLES.filter(p => inPoly(X, Y, p)); return p.length ? p.map(x => x.name).join(', ') : null; }
const fmtLL = (lon, lat) => `${Math.abs(lat).toFixed(3)}°${lat >= 0 ? 'N' : 'S'} ${Math.abs(lon).toFixed(3)}°${lon >= 0 ? 'E' : 'W'}`;
const fmtXY = (X, Y) => `${Math.abs(X).toFixed(0)} mi ${X >= 0 ? 'E' : 'W'}, ${Math.abs(Y).toFixed(0)} mi ${Y >= 0 ? 'N' : 'S'}`;
function wxBlock(X, Y) {

  return `<div class="wxnow"><div class="big">${Math.round(w.T)}°</div><div class="sky">${esc(w.sky)}${w.event ? ' · ' + esc(w.event) : ''}</div><div class="det">Wind ${w.windFrom} ${Math.round(w.kmh)} km/h · ${Math.round(w.P)} hPa${w.R > 0 ? ' · ' + w.R.toFixed(1) + ' mm/h' : ''}</div></div>
    <canvas class="fc" id="fc" width="640" height="220" aria-label="Five-day forecast"></canvas>`;
}
function drawForecast(X, Y) {
  const c = $('#fc'); if (!c) return;
  const g = c.getContext('2d'), W = c.width, H = c.height;
  const st = staticAt(X, Y);
  const N = 40, pts = [];
  for (let i = 0; i < N; i++) { const t = S.t + i * 0.125; pts.push({ t, ...weatherAt(X, Y, t, st) }); }
  g.clearRect(0, 0, W, H);
  const Ts = pts.map(p => p.T), lo = Math.floor(Math.min(...Ts) - 2), hi = Math.ceil(Math.max(...Ts) + 2);
  const x = i => 28 + i / (N - 1) * (W - 40), y = T => 24 + (1 - (T - lo) / (hi - lo)) * (H - 70);
  g.font = '20px "IBM Plex Mono", monospace'; g.fillStyle = 'rgba(236,230,214,0.5)';
  for (let d = 0; d <= 5; d++) { const i = d * 8; if (i >= N) break; g.fillStyle = 'rgba(222,204,160,0.12)'; g.fillRect(x(i), 10, 1.5, H - 40); g.fillStyle = 'rgba(236,230,214,0.55)'; g.fillText(d === 0 ? 'now' : WX.parts(pts[i].t).name.replace(/^(\d+) (\w{3}).*/, '$1 $2'), x(i) + 6, H - 8); }
  pts.forEach((p, i) => { if (p.R > 0) { const bh = Math.min(50, p.R * 9); g.fillStyle = p.snow > 0.5 ? 'rgba(180,170,255,0.8)' : 'rgba(142,197,214,0.75)'; g.fillRect(x(i) - 5, H - 34 - bh, 10, bh); } });
  g.strokeStyle = '#d9ac52'; g.lineWidth = 4; g.lineJoin = 'round'; g.beginPath();
  pts.forEach((p, i) => i ? g.lineTo(x(i), y(p.T)) : g.moveTo(x(i), y(p.T))); g.stroke();
  g.fillStyle = '#d9ac52'; g.beginPath(); g.arc(x(0), y(pts[0].T), 7, 0, 7); g.fill();
  g.fillStyle = 'rgba(236,230,214,0.7)'; g.fillText(hi + '°', 0, 30); g.fillText(lo + '°', 0, H - 44);
}

function updateScale() {
  const c = map.getCanvas(), y = c.clientHeight - 60, x = c.clientWidth / 2;
  const a = map.unproject([x - 50, y]), b = map.unproject([x + 50, y]);
  const pa = GEN.toXY(a.lng, a.lat), pb = GEN.toXY(b.lng, b.lat);
  const mi100 = Math.hypot(pa[0] - pb[0], pa[1] - pb[1]);
  if (!isFinite(mi100) || mi100 <= 0) { $('#scale').innerHTML = ''; return; }
  const nice = [0.05, 0.1, 0.25, 0.5, 1, 2, 5, 10, 20, 50, 100, 200, 500, 1000].find(v => v / mi100 * 100 >= 45) || 1000;
  const w = nice / mi100 * 100;
  $('#scale').innerHTML = `<div class="sbar" style="width:${w.toFixed(0)}px"></div><span>${nice < 1 ? Math.round(nice * 1760) + ' yd' : nice + ' mi'} · ${nice >= 3 ? (nice / 3).toFixed(nice >= 30 ? 0 : 1) + ' leagues' : Math.round(nice * 1609) + ' m'}</span>`;
}

function toggleMeasure(on) {
  const want = on === undefined ? !S.measure : on;
  S.measure = want ? [] : null;
  document.body.classList.toggle('pick', !!S.measure);
  document.querySelector('[data-p="measure"]').classList.toggle('on', !!S.measure);
  if (!want) { map.getSource('measure').setData(FC([])); $('#toast').classList.remove('open'); }
  else toast('Click points on the map to measure. Press Esc or the ruler again to finish.', 0);
}
function drawMeasure() {
  const m = S.measure; if (!m) return;
  const feats = m.map(p => pt(p[0], p[1], {}));
  if (m.length > 1) feats.push({ type: 'Feature', geometry: { type: 'LineString', coordinates: lineLL(m) }, properties: {} });
  map.getSource('measure').setData(FC(feats));
  let d = 0; for (let i = 1; i < m.length; i++) d += Math.hypot(m[i][0] - m[i - 1][0], m[i][1] - m[i - 1][1]);
  if (m.length > 1) toast(`<b>${d.toFixed(1)} miles</b> · ${(d / 3).toFixed(1)} leagues · ${(d * 1.609).toFixed(0)} km — about ${Math.max(1, Math.round(d / 20))} days on foot at a hobbit's pace, ${Math.max(1, Math.round(d / 45))} riding`, 0);
}

function toast(html, ms = 3500) {

  document.body.classList.toggle('pick', want);

async function openGround(X, Y, name) {
  if (!window.GROUND) { toast('The ground view is still loading. Try again in a moment.'); return; }
  const np = nearestPlace(X, Y);
  togglePlay(false);
  let heading = map.getBearing();
  if (name && PLN[name]) {
    // stand a little way off and look toward the place
    const p = PLN[name];
    const off = Math.max(0.12, (p.r || 0.2) * 0.55 + 0.08), a = (hashAng(p.name));
    X = p.X + Math.cos(a) * off; Y = p.Y + Math.sin(a) * off;
    heading = (Math.atan2(p.X - X, p.Y - Y) * 180 / Math.PI + 360) % 360;
  }
  window.GROUND.open({ X, Y, heading, t: S.t, title: name || (np.d < 3 ? 'Near ' + np.p.name : biomeAt(X, Y).name), sub: fmtXY(X, Y) + ' of Hobbiton', run, weatherAt, staticAt, places: PL, peaks: GEO.PEAKS, onExit: () => {} });
}
function hashAng(s) { let h = 0; for (const c of s) h = (h * 31 + c.charCodeAt(0)) | 0; return (h % 628) / 100; }

/* ---------------- patch loading ---------------- */
async function loadNear(Xc, Yc, offX, offZ) {
  const o = G.o, run = o.run, half = 2600, n = 321, mobile = innerWidth < 760;
  const [hr, tx, tr] = await Promise.all([
    run({ type: 'ph', X: Xc, Y: Yc, half, n }),
    textureFor(run, Xc, Yc, half, mobile ? 1536 : 2048, 8),
    run({ type: 'trees', X: Xc, Y: Yc, half, cell: 26, spacing: mobile ? 9 : 6.5, treeHalf: mobile ? 600 : 850, seed: 7, bHalf: half }),
  ]);

  const run = keys.shift ? 26 : 5.2;
  let f = 0, s = 0;
  if (keys.w || keys.arrowup) f += 1; if (keys.s || keys.arrowdown) f -= 1;
  if (keys.d || keys.arrowright) s += 1; if (keys.a || keys.arrowleft) s -= 1;
  if (keys.arrowleft && !keys.a) { G.yaw -= dt * 1.2; s += 1; }
  if (keys.arrowright && !keys.d) { G.yaw += dt * 1.2; s -= 1; }
  const fx = Math.sin(G.yaw), fz = -Math.cos(G.yaw);
  G.px += (fx * f + Math.cos(G.yaw) * s) * run * dt * (1 + G.fly / 40);
  G.pz += (fz * f + Math.sin(G.yaw) * s) * run * dt * (1 + G.fly / 40);
  if (keys[' ']) G.fly = Math.min(3000, G.fly + dt * (20 + G.fly));
  if (keys.c) G.fly = Math.max(0, G.fly - dt * (20 + G.fly));
  const lim = 55000; G.px = Math.max(-lim, Math.min(lim, G.px)); G.pz = Math.max(-lim, Math.min(lim, G.pz));
  const gy = groundAt(G.px, G.pz);
  const eye = gy + 1.7 + G.fly;
  G.camera.position.set(G.px, G.camera.position.y ? G.camera.position.y + (eye - G.camera.position.y) * Math.min(1, dt * 12) : eye, G.pz);
  const cp = Math.cos(G.pitch);
  G.camera.lookAt(G.px + Math.sin(G.yaw) * cp, G.camera.position.y + Math.sin(G.pitch), G.pz - Math.cos(G.yaw) * cp);
  G.sky.position.copy(G.camera.position);
  if (G.sunDir) {
    G.sun.position.set(G.px + G.sunDir.x * 1200, G.camera.position.y + G.sunDir.y * 1200, G.pz + G.sunDir.z * 1200);
    G.sun.target.position.set(G.px, G.camera.position.y, G.pz); G.sun.target.updateMatrixWorld();
  }
  G.skyMat.uniforms.time.value += dt;
  G.grassTime.value += dt;
  if (G.grassAt && Math.hypot(G.px - G.grassAt.x, G.pz - G.grassAt.z) > 12) placeGrass();
  if (G.rain.visible) {
    const a = G.rain.geometry.attributes.position, sp = G.wx.snow > 0.5 ? 2.2 : 14;
    for (let i = 0; i < a.count; i++) { let y = a.getY(i) - sp * dt; if (y < 0) y += 60; a.setY(i, y); }
    a.needsUpdate = true; G.rain.position.set(G.px, G.camera.position.y - 20, G.pz);
  }
  // stream a new near patch when the walker strays
  if (G.nearOff && !streaming && Math.hypot(G.px - G.nearOff.x, G.pz - G.nearOff.z) > 1500) {
    streaming = true;
    const ox = G.px, oz = G.pz;
    loadNear(G.X0 + ox / MI, G.Y0 - oz / MI, ox, oz).then(() => { streaming = false; }).catch(() => { streaming = false; });
  }
  if (G.labels) updateLabels();
  drawMini();
  if (G.wx && Math.floor(ts / 1000) !== G.lastSec) { G.lastSec = Math.floor(ts / 1000); updateAtmos(G.lastSec % 10 === 0); }
  G.renderer.render(G.scene, G.camera);
}

window.GROUND = { open, close, G };
</script>
